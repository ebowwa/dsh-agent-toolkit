# drift-check — the self-reviewing release agent.
#
# When scripts or reusable workflows change on main, this agent:
#   1. computes the next minor tag,
#   2. REVIEWS its own diff (agent pass): what changed, is any consumer's
#      shell input broken, is the change safe to auto-propagate,
#   3. tags ONLY if the review approves (TAG or TAG-WITH-FINDINGS; findings
#      ride along as release notes),
#   4. writes a release on the tag with the agent's review as notes, and
#      advances the moving major tag (@v1) consumers pin,
#   5. notifies registered consumers (DSH_AGENT_TOOLKIT_CONSUMERS repo variable) via
#      repository_dispatch so each can open its own bump PR.
#
# BLOCK verdict: no tag, red run — scripts/drift-verdict.mjs dumps the
# scrubbed review body to the run log (run 32568700263 blocked with the body
# stranded in $RUNNER_TEMP, wiped with the runner: a human got one word) —
# a human decides.
# Model: fleet default unless DSH_DRIFT_MODEL is set on this repo.
#
# RELEASE-TAG LAW (issue #231): numbered release tags are immutable and
# never empty-range. The flow mints vX.Y.0 only at a commit NO existing
# release tag names — a HEAD an existing release tag already names (re-run,
# re-point, dispatch with no new commits) skips the release loudly and
# green; that tag IS the release for this tree. Only the moving major tag
# (@v1) is ever force-moved, always onto the new release. v1.97.0 and
# v1.98.0 both naming 47a4f68 left v1.97.0..v1.98.0 an empty range whose
# release notes described content the range does not carry — that class
# ends here.

name: drift-check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/agent-*.yml'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: drift-check
  cancel-in-progress: true

jobs:
  drift:
    runs-on: [self-hosted, dsh]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: What changed since the last tag?
        id: scope
        run: |
          set -euo pipefail
          git fetch --tags -q
          LATEST="$(git tag -l 'v1.*' --sort=-v:refname | head -1)"
          if [ -z "$LATEST" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD | tail -1)"
            MAJOR=1; MINOR=0
          else
            BASE="$LATEST"
            MAJOR="${LATEST#v}"; MAJOR="${MAJOR%%.*}"
            MINOR="${LATEST#v*.}"; MINOR="${MINOR%%.*}"
          fi
          NEXT="v${MAJOR}.$((MINOR+1)).0"
          # the moving major tag consumers actually pin (README "Consumers
          # pin @v1") — derived from the same MAJOR that builds NEXT, so a
          # future v2 release advances v2 automatically
          MOVING="v${MAJOR}"
          # RELEASE-TAG LAW (issue #231): refuse the empty-range mint. If a
          # NUMBERED release tag already names HEAD, tagging NEXT here would
          # publish a release whose range is empty (v1.97.0 = v1.98.0 =
          # 47a4f68) while its notes describe real content. Skip loudly and
          # green — the existing tag is this tree's release. The moving
          # major also points at HEAD after every release and must not trip
          # the guard, hence the numbered-only filter.
          ALREADY_TAGGED="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -n "$ALREADY_TAGGED" ]; then
            echo "::warning::$ALREADY_TAGGED already names HEAD — refusing to mint ${NEXT} as an empty-range tag (issue #231); nothing to release"
          fi
          {
            echo "base=$BASE"
            echo "latest=${LATEST:-none}"
            echo "next=$NEXT"
            echo "moving=$MOVING"
            echo "already_tagged=${ALREADY_TAGGED}"
          } >> "$GITHUB_OUTPUT"
          echo "--- diff scope $BASE..HEAD ---"
          git diff --stat "$BASE..HEAD" -- scripts '.github/workflows/agent-*.yml' config | tail -5

      - name: Agent reviews its own diff (release gate)
        # issue #231: a HEAD already named by a release tag has no diff to
        # review and must not reach the tag mint
        if: steps.scope.outputs.already_tagged == ''
        env:
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          set -euo pipefail
          MASK="DSH-DRIFT-MASK-4f7a"
          echo "::add-mask::${MASK}"
          # Scope-isolated like the driver's launch (run-dsh-agent.sh): a host
          # $HOME/.doppler/.doppler.yaml scope would override the token's own
          # project binding and the probe would die on "token does not have
          # access to requested project …". Pristine HOME + cleared DOPPLER_*
          # env = the token's own scope, on any cell. The token rides the
          # ENVIRONMENT (DOPPLER_TOKEN, the CLI's env input for --token) via a
          # bash prefix assignment — never argv, which ps/cmdline exposes to
          # every local user (issue #95).
          command -v doppler >/dev/null 2>&1 \
            && MASK_HOME="$(mktemp -d "${TMPDIR:-/tmp}/dsh-doppler-probe.XXXXXX")" \
            && DOPPLER_TOKEN="$DOPPLER_SERVICE_TOKEN" \
               env -u DOPPLER_PROJECT -u DOPPLER_CONFIG -u DOPPLER_ENVIRONMENT HOME="$MASK_HOME" \
                 doppler run -- \
                   sh -c 'printf "::add-mask::%s\n" "$ZAI_API_KEY"' \
            && rm -rf "$MASK_HOME" || true

          TASK="You are the RELEASE stage of dsh-agent-toolkit — the toolkit other repos run on their own runners. A change landed on main; decide whether it is safe to tag and propagate.

          Scope: git diff ${BASE}..HEAD (scripts/, agent-*.yml workflows, config/).
          Method:
          1. Read the full diff of every changed file.
          2. For each reusable workflow: are all previously valid consumer
             'with:' inputs still valid? A NEW REQUIRED input is a breaking
             change -> say MAJOR in findings.
          3. For each script: behavioral changes consumers could depend on?
             Env-contract changes (new required DSH_*/env vars) are breaking.
          4. Validate syntax of changed scripts (node --check / bash -n).
          5. This is a STATIC review — do not run the agent loop or network.

          Write your review to $RUNNER_TEMP/drift-review.md with exactly:
            ## Verdict: TAG | TAG-WITH-FINDINGS | BLOCK
            ## What changed (one line per file)
            ## Consumer impact (which inputs/env/behaviors shifted)
            ## Findings (numbered, severity)
          Then reply with ONLY the single verdict word, nothing else.
          Never print secrets or absolute paths."

          export REPLY_TARGET=""
          # Extra host redactions for EVERY scrub of the review (pipeline
          # tee, drift-verdict log dump) — the same contract
          # run-dsh-agent.sh applies inside its own process tree.
          export DSH_SCRUB_EXTRA_HOSTS="${EXTRA_SCRUB_HOSTS:-}"
          bash scripts/run-dsh-agent.sh "$TASK" \
            | node scripts/scrub-output.mjs \
            | tee "$RUNNER_TEMP/drift-out.txt"
          # Strict verdict extraction + review-body surfacing (the script
          # header documents the incident). The body is printed to this log
          # on EVERY verdict — BLOCK most of all, where no release exists to
          # carry it; stdout carries only the verdict word. Precedence when
          # an off-contract reply is ambiguous: the reply's bare verdict
          # line wins, the review's "## Verdict:" header is the fallback,
          # prose never qualifies, and no verdict anywhere = no tag.
          VERDICT="$(node scripts/drift-verdict.mjs \
            "$RUNNER_TEMP/drift-out.txt" "$RUNNER_TEMP/drift-review.md")"
          {
            echo "VERDICT=$VERDICT"
          } >> "$GITHUB_ENV"
          echo "release-review verdict: ${VERDICT:-none}"

      - name: Tag + release + notify (only on TAG verdicts)
        # issue #231: never mint a release tag at a commit an existing
        # numbered release tag already names — empty range, empty delta
        if: steps.scope.outputs.already_tagged == ''
        env:
          GH_TOKEN: ${{ github.token }}
          # repository_dispatch to CONSUMER repos needs a PAT (github.token
          # is repo-scoped); falls back gracefully for public-mode consumers.
          PAT_TOKEN: ${{ secrets.DSH_AGENT_TOOLKIT_REPO_TOKEN }}
          DSH_AGENT_TOOLKIT_CONSUMERS: ${{ vars.DSH_AGENT_TOOLKIT_CONSUMERS }}
          NEXT: ${{ steps.scope.outputs.next }}
          MOVING: ${{ steps.scope.outputs.moving }}
          VERDICT: ${{ env.VERDICT }}
        run: |
          set -euo pipefail
          case "$VERDICT" in
            TAG|TAG-WITH-FINDINGS) echo "verdict $VERDICT — tagging $NEXT";;
            *) echo "verdict '${VERDICT:-none}' — NOT tagging; see the review above"; exit 1;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEXT"
          git push origin "$NEXT"
          if [ -f "$RUNNER_TEMP/drift-review.md" ]; then
            # Release notes are a public surface: the review body is scrubbed
            # before publishing (fail-closed — a scrubber failure aborts the
            # step rather than publishing raw notes).
            node scripts/scrub-output.mjs \
              < "$RUNNER_TEMP/drift-review.md" \
              > "$RUNNER_TEMP/drift-review.scrubbed.md"
            gh release create "$NEXT" --title "$NEXT" --notes-file "$RUNNER_TEMP/drift-review.scrubbed.md"
          else
            gh release create "$NEXT" --title "$NEXT" --notes "Automated release ${NEXT}. Agent review body unavailable; see the run log."
          fi
          # advance the moving MAJOR tag — the pin consumers document (README
          # "Consumers pin @v1"; examples/*.yml pin @v1). This step used to
          # advance an undocumented bare 'v' instead, leaving v1 frozen at
          # v1.0.9 through 33 releases (issue #38): every pinned consumer
          # resolved @v1 to a stale toolkit while drift ran green. 'v' is
          # retired — one moving tag per major, the documented pin. A test
          # (tests/drift-moving-tag.test.mjs) fails if this step and the
          # documented pin ever drift apart again.
          git tag -f "$MOVING" "$NEXT" && git push -q -f origin "$MOVING"
          # notify registered consumers so each opens its own bump PR.
          # The consumers list rides the env (REVIEW.md workflow discipline:
          # task/config text reaches bash through env, never raw '{{ }}
          # interpolation) — parsing behavior unchanged: split on commas
          # and whitespace via tr, drop empties via the read guard.
          CONSUMERS="$(printf '%s' "$DSH_AGENT_TOOLKIT_CONSUMERS" | tr ',[:space:]' '\n')"
          while read -r repo; do
            [ -n "$repo" ] || continue
            DISPATCH_TOKEN="${PAT_TOKEN:-$GH_TOKEN}"
            gh api "repos/$repo/dispatches" --method POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -f event_type="dsh-agent-toolkit-release" \
              -F "client_payload[tag]=${NEXT}" 2>/dev/null \
              && echo "notified $repo" || echo "notify failed: $repo"
          done <<< "$CONSUMERS"
