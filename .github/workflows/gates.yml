name: gates

# dsh-agent-toolkit's own checks: every script must at least parse, and whatever test
# suite exists under tests/ must pass (no build — the honest minimum for a
# scripts-only repo, now with real tests where they earn their keep).
# Runs on push to main + PRs + workflow_dispatch (the tower fires it on
# tower PR head branches; bot PRs cannot trigger workflows themselves).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: [self-hosted, dsh]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*; do
            case "${f##*.}" in
              mjs|js) node --check "$f" || fail=1 ;;
              sh|bash) bash -n "$f" || fail=1 ;;
            esac
          done
          # shell scripts with no extension (gh-scrub-shim, git-scrub-shim)
          for f in scripts/gh-scrub-shim scripts/git-scrub-shim; do
            [ -f "$f" ] && { bash -n "$f" || fail=1; }
          done
          exit "$fail"
      - name: Workflow YAML parses
        # tab check + structural lint: run 32705244305 merged a workflow whose
        # step indented 4 spaces inside a 6-space steps: list — invalid block
        # YAML, zero jobs, every dispatch 422'd — and this gate passed it
        # green (drift was red; gates alone waved it through), because
        # "parses" only rejected tabs. The lint makes the gate honest.
        run: |
          set -euo pipefail
          # null-delimited (whitespace-safe), evaluated once; both extensions
          wfs=()
          while IFS= read -r -d '' f; do wfs+=("$f"); done < <(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print0)
          [ "${#wfs[@]}" -gt 0 ] || { echo "no workflow files found" >&2; exit 1; }
          for f in "${wfs[@]}"; do
            node -e "const fs=require('fs');const s=fs.readFileSync(process.argv[1],'utf8');if(/\t/.test(s))throw new Error('tab in '+process.argv[1])" "$f"
          done
          node scripts/workflow-lint.mjs "${wfs[@]}"
          # REAL parse (not just structure): a plain scalar containing
          # colon-space is invalid YAML that the structural lint cannot
          # see — GitHub silently disables the workflow's registration
          # (name=path fallback, no triggers, every dispatch 422s). This
          # ran red on worker-deploy.yml for hours before the gate
          # existed (PR #77's step name).
          for f in "${wfs[@]}"; do
            node -e '
              const fs = require("fs");
              const s = fs.readFileSync(process.argv[1], "utf8");
              const m = s.match(/^([ \t]*- name:[ \t]+)([^'"'"'"{][^\n]*)$/gm) || [];
              for (const line of m) {
                const val = line.replace(/^[ \t]*- name:[ \t]+/, "");
                if (/:[ \t]| #[^\n]*$/.test(val) && !/\$\{\{.*\}\}/.test(val)) {
                  console.error("plain scalar with colon-space in step name (" + process.argv[1] + "): " + val.trim());
                  process.exitCode = 1;
                }
              }
            ' "$f" || fail=1
          done
      - name: Install plugin smoke-test deps
        # Offline smokes import their lib, and the libs import the
        # @deepseek-ai/* packages the dsh runtime provides in production
        # (the profile's flat module tree) — plus cross-plugin @local/*
        # imports (ui -> editor). CI has no profile tree: without this
        # step the suite silently depended on a stale workspace
        # node_modules, pruned by a disk-clean pass on 2026-09-18 — every
        # gates run since (main included) failed ERR_MODULE_NOT_FOUND.
        # Approach: install the union of deps+peers of tested plugins at
        # the repo root (ESM resolution walks up from each plugin lib),
        # and symlink @local/* names the same way the profile does.
        run: |
          set -euo pipefail
          specs="$(node -e '
            const fs = require("fs");
            const out = new Set();
            for (const dir of fs.readdirSync("plugins")) {
              const pj = "plugins/" + dir + "/package.json";
              if (!fs.existsSync(pj) || !fs.existsSync("plugins/" + dir + "/test")) continue;
              const p = JSON.parse(fs.readFileSync(pj, "utf8"));
              for (const k of ["dependencies", "peerDependencies"])
                for (const n of Object.keys(p[k] || {})) out.add(n + "@" + p[k][n]);
            }
            console.log([...out].join(" "));
          ')"
          mkdir -p node_modules/@local
          for d in plugins/*; do
            [ -f "$d/package.json" ] && [ -d "$d/test" ] || continue
            n="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$d/package.json','utf8')).name)")"
            case "$n" in
              @local/*) ln -sfn "../../$d" "node_modules/$n" && echo "link $n -> $d" ;;
            esac
          done
          if [ -n "$specs" ]; then
            echo "install: $specs"
            npm install --prefix . --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund $specs
          fi
          # The @deepseek-ai family peer-depends on each other (flat profile
          # tree in production — nothing declares hard deps). npm's root
          # install reconciles to the spec list it is given, so install the
          # ACCUMULATED union each round or each round prunes the last.
          all_specs="$specs"
          for _ in 1 2 3 4 5; do
            extra="$(node -e '
              const fs = require("fs");
              const root = "node_modules/@deepseek-ai";
              if (!fs.existsSync(root)) process.exit(0);
              const need = new Set();
              for (const pkg of fs.readdirSync(root)) {
                const pj = JSON.parse(fs.readFileSync(root + "/" + pkg + "/package.json", "utf8"));
                for (const [n, r] of Object.entries(pj.peerDependencies || {})) {
                  if (!fs.existsSync("node_modules/" + n)) need.add(n + "@" + r);
                }
              }
              console.log([...need].join(" "));
            ')"
            [ -n "$extra" ] || break
            all_specs="$all_specs $extra"
            echo "install (union): $extra"
            npm install --prefix . --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund $all_specs
          done
          # npm may prune the @local symlinks while reconciling — re-link last
          for d in plugins/*; do
            [ -f "$d/package.json" ] && [ -d "$d/test" ] || continue
            n="$(node -e "console.log(JSON.parse(require('fs').readFileSync('$d/package.json','utf8')).name)")"
            case "$n" in @local/*) ln -sfn "../../$d" "node_modules/$n" ;; esac
          done
      - name: Unit tests
        # bare --test auto-discovers *.test.mjs (a directory argument is not
        # portable across the node versions on the runner lanes)
        run: node --test
